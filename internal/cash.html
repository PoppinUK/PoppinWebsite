<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poppin — Internal Fund Sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pop-red: #ff2e63;
      --pop-yellow: #ffd93d;
      --navy: #1f4e79;
      --navy-dark: #163a5c;
      --sheet-header: #1f4e79;
      --row-a: #e8f2fa;
      --row-b: #ffffff;
      --grid: #9eb4cc;
      --border: #d4e0ec;
      --text: #1a2332;
      --muted: #64748b;
      --surface: #ffffff;
      --page: #f1f5f9;
      --danger: #dc2626;
      --success: #059669;
      --shadow: 0 4px 24px rgba(31, 78, 121, 0.08);
      --radius: 12px;
    }

    body {
      font-family: "Inter", system-ui, sans-serif;
      background: var(--page);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .hidden { display: none !important; }

    /* Logo — never stretch */
    .logo-wrap {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      line-height: 0;
    }

    .logo-wrap img {
      display: block;
      height: 32px;
      width: auto;
      max-width: 140px;
      object-fit: contain;
      object-position: left center;
    }

    .login-wrap .logo-wrap img { height: 40px; max-width: 160px; }

    /* Login */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255, 217, 61, 0.35), transparent),
        var(--page);
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.25rem;
      box-shadow: var(--shadow);
    }

    .login-card .logo-wrap {
      display: flex;
      justify-content: center;
      width: 100%;
      margin-bottom: 1.5rem;
    }

    .login-card h1 {
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: -0.02em;
    }

    .login-card .subtitle {
      font-size: 0.875rem;
      color: var(--muted);
      text-align: center;
      margin: 0.35rem 0 1.75rem;
    }

    .field { margin-bottom: 1.1rem; }

    .field label {
      display: block;
      font-size: 0.6875rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .field input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9375rem;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field input:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 3px rgba(31, 78, 121, 0.12);
    }

    .field input:disabled {
      background: #f8fafc;
      color: var(--muted);
    }

    .btn-primary {
      width: 100%;
      margin-top: 0.25rem;
      padding: 0.75rem;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9375rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary:hover { background: var(--navy-dark); }
    .btn-primary:disabled { opacity: 0.55; cursor: wait; }

    .login-error {
      margin-top: 0.85rem;
      font-size: 0.8125rem;
      color: var(--danger);
      text-align: center;
      min-height: 1.2rem;
    }

    /* App shell */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1.5rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
    }

    .app-header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
      min-width: 0;
    }

    .app-header h1 {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .btn-ghost {
      padding: 0.45rem 0.9rem;
      font-size: 0.8125rem;
      font-weight: 500;
      font-family: inherit;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      color: var(--muted);
      transition: background 0.15s, color 0.15s;
    }

    .btn-ghost:hover {
      background: #f8fafc;
      color: var(--text);
    }

    .app-layout {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.5rem;
      padding-bottom: 3.5rem;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 960px) {
      .app-layout { grid-template-columns: 1fr; }
    }

    .main-panel {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .tables-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    @media (max-width: 700px) {
      .tables-row { grid-template-columns: 1fr; }
    }

    .table-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .sheet-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 0.875rem;
    }

    .sheet-table caption {
      caption-side: top;
      text-align: center;
      font-weight: 700;
      font-size: 0.8125rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.65rem;
      background: var(--sheet-header);
      color: #fff;
    }

    .sheet-table thead th {
      background: var(--sheet-header);
      color: #fff;
      font-weight: 600;
      font-size: 0.75rem;
      padding: 0.5rem 0.65rem;
      border: 1px solid var(--grid);
      text-align: left;
    }

    .sheet-table thead th.col-amount { width: 32%; }
    .sheet-table thead th.col-remove {
      width: 40px;
      padding: 0;
      text-align: center;
    }

    .sheet-table tbody td {
      border: 1px solid var(--grid);
      padding: 0;
      height: 36px;
      vertical-align: middle;
    }

    .sheet-table tbody tr:nth-child(odd) td { background: var(--row-a); }
    .sheet-table tbody tr:nth-child(even) td { background: var(--row-b); }

    .cell-input {
      width: 100%;
      height: 36px;
      border: none;
      background: transparent;
      padding: 0 0.65rem;
      font: inherit;
      color: inherit;
      outline: none;
    }

    .cell-input:focus {
      background: #fffbeb;
      box-shadow: inset 0 0 0 2px var(--pop-yellow);
    }

    .cell-input.amount { text-align: right; font-variant-numeric: tabular-nums; }

    .table-actions {
      padding: 0.65rem 0.75rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .btn-add {
      font-size: 0.75rem;
      font-weight: 600;
      font-family: inherit;
      padding: 0.4rem 0.75rem;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      color: var(--navy);
      transition: background 0.15s;
    }

    .btn-add:hover { background: var(--row-a); }

    td.cell-remove {
      padding: 0;
      text-align: center;
      vertical-align: middle;
      width: 40px;
    }

    .btn-remove-row {
      width: 28px;
      height: 28px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: #94a3b8;
      font-size: 1.125rem;
      line-height: 1;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, color 0.15s;
    }

    .btn-remove-row:hover {
      background: #fee2e2;
      color: var(--danger);
    }

    .btn-remove-row:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-remove-row:disabled:hover {
      background: transparent;
      color: #94a3b8;
    }

    .total-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .total-card .label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .total-card .value {
      font-size: 1.75rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .total-card .value.negative { color: var(--danger); }
    .total-card .value.positive { color: var(--success); }

    /* Audit log */
    .audit-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 6rem);
      position: sticky;
      top: 1rem;
    }

    @media (max-width: 960px) {
      .audit-panel { position: static; max-height: 420px; }
    }

    .audit-header {
      padding: 1rem 1.15rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .audit-header h2 {
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .audit-header span {
      font-size: 0.6875rem;
      font-weight: 600;
      color: var(--muted);
      background: #f1f5f9;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
    }

    .audit-list {
      overflow-y: auto;
      flex: 1;
      padding: 0.65rem;
    }

    .audit-empty {
      padding: 2rem 1rem;
      text-align: center;
      font-size: 0.8125rem;
      color: var(--muted);
    }

    .audit-item {
      display: flex;
      gap: 0.65rem;
      padding: 0.65rem 0.55rem;
      border-radius: 8px;
      transition: background 0.12s;
    }

    .audit-item:hover { background: #f8fafc; }

    .audit-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-top: 0.35rem;
      flex-shrink: 0;
    }

    .audit-dot.created { background: var(--success); }
    .audit-dot.updated { background: var(--navy); }
    .audit-dot.deleted { background: var(--danger); }

    .audit-body { flex: 1; min-width: 0; }

    .audit-action {
      font-size: 0.8125rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .audit-action .tag {
      display: inline-block;
      font-size: 0.625rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      margin-right: 0.35rem;
      vertical-align: middle;
    }

    .tag.incoming { background: #d1fae5; color: #065f46; }
    .tag.outgoing { background: #fee2e2; color: #991b1b; }

    .audit-detail {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .audit-time {
      font-size: 0.6875rem;
      color: #94a3b8;
      margin-top: 0.2rem;
    }

    .status-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.45rem 1.25rem;
      font-size: 0.75rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      z-index: 50;
    }

    .status-bar.saving { color: var(--navy); }
    .status-bar.error { color: var(--danger); }

    .toast-container {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-width: min(360px, calc(100vw - 2rem));
      pointer-events: none;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text);
      pointer-events: auto;
      transform: translateX(-120%);
      opacity: 0;
      transition: transform 0.28s cubic-bezier(0.34, 1.2, 0.64, 1), opacity 0.28s ease;
    }

    .toast.show {
      transform: translateX(0);
      opacity: 1;
    }

    .toast.hide {
      transform: translateX(-120%);
      opacity: 0;
    }

    .toast-success {
      border-left: 4px solid var(--success);
    }

    .toast-error {
      border-left: 4px solid var(--danger);
    }

    .toast-destructive {
      border-left: 4px solid var(--danger);
      background: #fffbfb;
    }

    .toast-message {
      flex: 1;
      line-height: 1.35;
    }

    .toast-undo {
      flex-shrink: 0;
      padding: 0.35rem 0.65rem;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--navy);
      background: #e8f2fa;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .toast-undo:hover {
      background: var(--row-a);
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(241, 245, 249, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      font-size: 0.9375rem;
      font-weight: 500;
      color: var(--muted);
    }

    .btn-export {
      padding: 0.45rem 0.9rem;
      font-size: 0.8125rem;
      font-weight: 600;
      font-family: inherit;
      background: var(--navy);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-export:hover { background: var(--navy-dark); }

    .export-modal {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
    }

    .export-dialog {
      width: 100%;
      max-width: 920px;
      max-height: 90vh;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .export-dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .export-dialog-header h2 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .export-dialog-header p {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    .btn-close-modal {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 8px;
      background: #f1f5f9;
      color: var(--muted);
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
      font-family: inherit;
      flex-shrink: 0;
    }

    .btn-close-modal:hover { background: #e2e8f0; color: var(--text); }

    .export-preview-wrap {
      flex: 1;
      overflow: auto;
      padding: 1.25rem;
      background: #f8fafc;
    }

    .export-preview-inner {
      background: #fff;
      border: 1px solid var(--grid);
      border-radius: 6px;
      overflow: auto;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.04);
    }

    .preview-excel-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8125rem;
      table-layout: fixed;
    }

    .preview-excel-table th,
    .preview-excel-table td {
      border: 1px solid var(--grid);
      padding: 0.4rem 0.55rem;
      text-align: left;
    }

    .preview-excel-table .gap-col {
      width: 24px;
      min-width: 24px;
      background: #f1f5f9;
      border-top: none;
      border-bottom: none;
    }

    .preview-excel-table .section-head {
      background: var(--sheet-header);
      color: #fff;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.75rem;
    }

    .preview-excel-table .col-head {
      background: var(--sheet-header);
      color: #fff;
      font-weight: 600;
      font-size: 0.6875rem;
    }

    .preview-excel-table tbody tr:nth-child(odd) td:not(.gap-col) { background: var(--row-a); }
    .preview-excel-table tbody tr:nth-child(even) td:not(.gap-col) { background: var(--row-b); }

    .preview-excel-table .amount-cell {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .preview-excel-table .total-row td {
      border-top: 2px solid var(--grid);
      font-weight: 700;
      background: #fff !important;
    }

    .preview-excel-table .total-row .amount-cell.negative { color: var(--danger); }
    .preview-excel-table .total-row .amount-cell.positive { color: var(--success); }

    .export-dialog-footer {
      display: flex;
      justify-content: flex-end;
      gap: 0.65rem;
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .btn-download {
      padding: 0.55rem 1.1rem;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      background: var(--success);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-download:hover { background: #047857; }
  </style>
</head>
<body>

  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="false"></div>

  <div id="loadingOverlay" class="loading-overlay hidden">Loading fund sheet…</div>

  <section id="loginView" class="login-wrap">
    <div class="login-card">
      <div class="logo-wrap">
        <img src="../text.png" alt="Poppin" width="160" height="40" />
      </div>
      <h1>Internal Fund Sheet</h1>
      <p class="subtitle">Staff access — view and manage company funds</p>
      <form id="loginForm">
        <div class="field">
          <label for="emailDisplay">Email</label>
          <input type="text" id="emailDisplay" value="admin" disabled autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
        <p class="login-error" id="loginError" role="alert"></p>
      </form>
    </div>
  </section>

  <div id="appView" class="hidden">
    <header class="app-header">
      <div class="app-header-left">
        <div class="logo-wrap">
          <img src="../text.png" alt="Poppin" width="140" height="32" />
        </div>
        <h1>Internal Fund Sheet</h1>
      </div>
      <div class="app-header-right">
        <button type="button" class="btn-export" id="exportExcelBtn">Export Excel</button>
        <button type="button" class="btn-ghost" id="signOutBtn">Sign out</button>
      </div>
    </header>

    <div class="app-layout">
      <main class="main-panel">
        <div class="tables-row">
          <div class="table-card">
            <table class="sheet-table" id="outgoingTable" aria-label="Outgoing funds">
              <caption>Outgoing</caption>
              <thead>
                <tr>
                  <th class="col-amount">Amount £</th>
                  <th>Description</th>
                  <th class="col-remove" aria-label="Remove row"></th>
                </tr>
              </thead>
              <tbody id="outgoingBody"></tbody>
            </table>
            <div class="table-actions">
              <button type="button" class="btn-add" data-direction="outgoing">+ Add row</button>
            </div>
          </div>
          <div class="table-card">
            <table class="sheet-table" id="incomingTable" aria-label="Incoming funds">
              <caption>Incoming</caption>
              <thead>
                <tr>
                  <th class="col-amount">Amount £</th>
                  <th>Description</th>
                  <th class="col-remove" aria-label="Remove row"></th>
                </tr>
              </thead>
              <tbody id="incomingBody"></tbody>
            </table>
            <div class="table-actions">
              <button type="button" class="btn-add" data-direction="incoming">+ Add row</button>
            </div>
          </div>
        </div>

        <div class="total-card">
          <div class="label">Net balance</div>
          <div class="value" id="totalValue">£0.00</div>
        </div>
      </main>

      <aside class="audit-panel" aria-label="Audit log">
        <div class="audit-header">
          <h2>Audit log</h2>
          <span id="auditCount">0</span>
        </div>
        <div class="audit-list" id="auditList">
          <p class="audit-empty">No activity yet</p>
        </div>
      </aside>
    </div>

    <footer class="status-bar" id="statusBar">
      <span id="statusText">Ready</span>
      <span id="statusUser"></span>
    </footer>
  </div>

  <div id="exportModal" class="export-modal hidden" role="dialog" aria-modal="true" aria-labelledby="exportModalTitle">
    <div class="export-dialog">
      <div class="export-dialog-header">
        <div>
          <h2 id="exportModalTitle">Excel preview</h2>
          <p id="exportFilename">poppin-fund-sheet.xlsx</p>
        </div>
        <button type="button" class="btn-close-modal" id="exportCloseBtn" aria-label="Close">×</button>
      </div>
      <div class="export-preview-wrap">
        <div class="export-preview-inner" id="exportPreview"></div>
      </div>
      <div class="export-dialog-footer">
        <button type="button" class="btn-ghost" id="exportCancelBtn">Cancel</button>
        <button type="button" class="btn-download" id="exportDownloadBtn">Download Excel</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://jijawenoxizwwnpgnbsw.supabase.co";
    const SUPABASE_KEY = "sb_publishable_qxvoI4ZBtt2qV3qWicrhaw_eZKvLPRR";
    const LOGIN_EMAIL = "admin@poppin.internal";
    const TABLE = "internalfundsheet";
    const MIN_ROWS = 5;
    const CREATED_EPS_MS = 2500;

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let rows = { incoming: [], outgoing: [] };
    let extraBlankRows = 0;
    let auditExtras = [];
    let sheetRecords = [];
    let saveTimer = null;
    let hasLoadedOnce = false;
    let isSaving = false;
    let pendingExport = null;
    let pendingRemoveSaveTimer = null;

    const $ = (id) => document.getElementById(id);

    function show(el) { el.classList.remove("hidden"); }
    function hide(el) { el.classList.add("hidden"); }

    function setStatus(text, type = "") {
      const bar = $("statusBar");
      bar.className = "status-bar" + (type ? " " + type : "");
      $("statusText").textContent = text;
    }

    function dismissToast(el) {
      if (!el || !el.parentNode) return;
      el.classList.remove("show");
      el.classList.add("hide");
      setTimeout(() => el.remove(), 280);
    }

    function showToast({ message, type = "success", undo = null, duration = null }) {
      const hasUndo = typeof undo === "function";
      const toastType = type === "destructive" ? "destructive" : type === "error" ? "error" : "success";
      const ms = duration ?? (hasUndo ? 8000 : 4000);

      const el = document.createElement("div");
      el.className = `toast toast-${toastType}`;
      el.setAttribute("role", toastType === "error" ? "alert" : "status");

      const msg = document.createElement("span");
      msg.className = "toast-message";
      msg.textContent = message;
      el.appendChild(msg);

      let dismissTimer = setTimeout(() => dismissToast(el), ms);

      if (hasUndo) {
        const undoBtn = document.createElement("button");
        undoBtn.type = "button";
        undoBtn.className = "toast-undo";
        undoBtn.textContent = "Undo";
        undoBtn.addEventListener("click", () => {
          clearTimeout(dismissTimer);
          undo();
          dismissToast(el);
        });
        el.appendChild(undoBtn);
      }

      $("toastContainer").appendChild(el);
      requestAnimationFrame(() => el.classList.add("show"));
      return el;
    }

    function parseAmount(raw) {
      if (raw == null) return 0;
      const cleaned = String(raw).replace(/[£,\s]/g, "").trim();
      if (!cleaned) return 0;
      const n = parseFloat(cleaned);
      return Number.isFinite(n) ? n : 0;
    }

    function formatMoney(n) {
      const sign = n < 0 ? "-" : "";
      return sign + "£" + Math.abs(n).toFixed(2);
    }

    function formatAuditTime(iso) {
      const d = new Date(iso);
      return d.toLocaleString(undefined, {
        day: "numeric",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function blankRow(direction, sortOrder) {
      return {
        id: null,
        direction,
        amount: 0,
        description: "",
        sort_order: sortOrder,
      };
    }

    function buildAuditEntries(records) {
      const entries = [];

      for (const row of records) {
        const created = new Date(row.created_at);
        const updated = new Date(row.updated_at);
        const desc = (row.description || "").trim() || "(no description)";
        const amt = formatMoney(Number(row.amount) || 0);
        const dir = row.direction === "incoming" ? "incoming" : "outgoing";

        entries.push({
          type: "created",
          at: created,
          direction: dir,
          amount: amt,
          description: desc,
          id: row.id,
        });

        if (updated.getTime() - created.getTime() > CREATED_EPS_MS) {
          entries.push({
            type: "updated",
            at: updated,
            direction: dir,
            amount: amt,
            description: desc,
            id: row.id,
          });
        }
      }

      for (const extra of auditExtras) {
        entries.push(extra);
      }

      entries.sort((a, b) => b.at - a.at);
      return entries;
    }

    function renderAuditLog() {
      const list = $("auditList");
      const entries = buildAuditEntries(sheetRecords);
      $("auditCount").textContent = String(entries.length);

      if (!entries.length) {
        list.innerHTML = '<p class="audit-empty">No activity yet</p>';
        return;
      }

      const actionLabel = {
        created: "Entry added",
        updated: "Entry updated",
        deleted: "Entry removed",
      };

      list.innerHTML = entries
        .map((e) => {
          const tagClass = e.direction === "incoming" ? "incoming" : "outgoing";
          const tagText = e.direction === "incoming" ? "In" : "Out";
          return `
            <div class="audit-item">
              <span class="audit-dot ${e.type}" aria-hidden="true"></span>
              <div class="audit-body">
                <div class="audit-action">
                  <span class="tag ${tagClass}">${tagText}</span>
                  ${actionLabel[e.type]}
                </div>
                <div class="audit-detail">${escapeHtml(e.amount)} · ${escapeHtml(e.description)}</div>
                <div class="audit-time">${formatAuditTime(e.at)}</div>
              </div>
            </div>
          `;
        })
        .join("");
    }

    function padRows(list, direction) {
      const out = [...list].sort((a, b) => a.sort_order - b.sort_order);
      const target = MIN_ROWS + extraBlankRows;
      while (out.length < target) {
        out.push(blankRow(direction, out.length));
      }
      return out;
    }

    function rowHasContent(tr) {
      if (!tr) return false;
      const amount = parseAmount(tr.querySelector('[data-field="amount"]')?.value);
      const description = (tr.querySelector('[data-field="description"]')?.value || "").trim();
      return !!(amount || description || tr.dataset.id);
    }

    function renderBothTables() {
      renderTable("outgoing", "outgoingBody");
      renderTable("incoming", "incomingBody");
    }

    function addRowPair() {
      extraBlankRows++;
      renderBothTables();
      updateTotal();
      showToast({ message: "Row added to both tables" });
    }

    function getTrRowData(tr) {
      return {
        amount: parseAmount(tr.querySelector('[data-field="amount"]').value),
        description: (tr.querySelector('[data-field="description"]').value || "").trim(),
        id: tr.dataset.id || null,
      };
    }

    function captureRowPairAt(index) {
      const outTrs = $("outgoingBody").querySelectorAll("tr");
      const inTrs = $("incomingBody").querySelectorAll("tr");
      return {
        index,
        outgoing: getTrRowData(outTrs[index]),
        incoming: getTrRowData(inTrs[index]),
        extraBlankRows,
      };
    }

    function createRowElement(direction, rowData, index, canRemoveAny) {
      const tr = document.createElement("tr");
      tr.dataset.direction = direction;
      tr.dataset.index = String(index);
      if (rowData.id) tr.dataset.id = rowData.id;

      const canRemove =
        canRemoveAny ||
        rowData.amount ||
        rowData.description ||
        rowData.id;

      const amountDisplay = rowData.amount
        ? "£ " + Math.abs(rowData.amount).toFixed(2)
        : "";

      tr.innerHTML = `
        <td>
          <input type="text" class="cell-input amount" data-field="amount"
            value="${amountDisplay}"
            placeholder="£ 0.00" inputmode="decimal" />
        </td>
        <td>
          <input type="text" class="cell-input" data-field="description"
            value="${escapeHtml(rowData.description || "")}" placeholder="" />
        </td>
        <td class="cell-remove">
          <button type="button" class="btn-remove-row"
            aria-label="Remove row ${index + 1}" title="Remove row"
            ${canRemove ? "" : "disabled"}>×</button>
        </td>
      `;
      return tr;
    }

    function insertRowPairAt(snapshot) {
      const outBody = $("outgoingBody");
      const inBody = $("incomingBody");
      const outRef = outBody.querySelectorAll("tr")[snapshot.index] || null;
      const inRef = inBody.querySelectorAll("tr")[snapshot.index] || null;
      const canRemoveAny = outBody.querySelectorAll("tr").length + 1 > MIN_ROWS;

      extraBlankRows = snapshot.extraBlankRows;

      const outTr = createRowElement("outgoing", snapshot.outgoing, snapshot.index, canRemoveAny);
      const inTr = createRowElement("incoming", snapshot.incoming, snapshot.index, canRemoveAny);

      if (outRef) {
        outBody.insertBefore(outTr, outRef);
        inBody.insertBefore(inTr, inRef);
      } else {
        outBody.appendChild(outTr);
        inBody.appendChild(inTr);
      }

      bindCellEvents(outBody);
      bindCellEvents(inBody);
      refreshRemoveButtons();
      updateTotal();
    }

    function scheduleSaveAfterRemove() {
      clearTimeout(saveTimer);
      clearTimeout(pendingRemoveSaveTimer);
      pendingRemoveSaveTimer = setTimeout(() => {
        pendingRemoveSaveTimer = null;
        queueSaveFromDom();
      }, 600);
    }

    function removeRowAtIndex(index) {
      const outTrs = $("outgoingBody").querySelectorAll("tr");
      const inTrs = $("incomingBody").querySelectorAll("tr");
      if (index < 0 || index >= outTrs.length || index >= inTrs.length) return;

      const canRemove =
        outTrs.length > MIN_ROWS ||
        rowHasContent(outTrs[index]) ||
        rowHasContent(inTrs[index]);

      if (!canRemove) return;

      const snapshot = captureRowPairAt(index);

      outTrs[index].remove();
      inTrs[index].remove();

      const remaining = $("outgoingBody").querySelectorAll("tr").length;
      if (remaining < MIN_ROWS + extraBlankRows) {
        extraBlankRows = Math.max(0, remaining - MIN_ROWS);
      }

      refreshRemoveButtons();
      updateTotal();
      scheduleSaveAfterRemove();

      showToast({
        message: "Row removed from both tables",
        type: "destructive",
        undo: async () => {
          clearTimeout(pendingRemoveSaveTimer);
          pendingRemoveSaveTimer = null;
          clearTimeout(saveTimer);
          insertRowPairAt(snapshot);

          const outTr = $("outgoingBody").querySelectorAll("tr")[snapshot.index];
          const inTr = $("incomingBody").querySelectorAll("tr")[snapshot.index];
          const pairs = [
            [outTr, snapshot.outgoing],
            [inTr, snapshot.incoming],
          ];

          for (const [tr, data] of pairs) {
            if (!tr?.dataset.id || !data.id) continue;
            const { data: found } = await sb
              .from(TABLE)
              .select("id")
              .eq("id", data.id)
              .maybeSingle();
            if (!found) delete tr.dataset.id;
          }

          queueSaveFromDom();
          showToast({ message: "Row restored" });
        },
      });
    }

    function refreshRemoveButtons() {
      const outTrs = [...$("outgoingBody").querySelectorAll("tr")];
      const inTrs = [...$("incomingBody").querySelectorAll("tr")];
      const canRemoveAny = outTrs.length > MIN_ROWS;

      outTrs.forEach((tr, index) => {
        const btn = tr.querySelector(".btn-remove-row");
        if (!btn) return;
        const canRemove =
          canRemoveAny || rowHasContent(tr) || rowHasContent(inTrs[index]);
        btn.disabled = !canRemove;
      });

      inTrs.forEach((tr, index) => {
        const btn = tr.querySelector(".btn-remove-row");
        if (!btn) return;
        const canRemove =
          canRemoveAny || rowHasContent(tr) || rowHasContent(outTrs[index]);
        btn.disabled = !canRemove;
      });
    }

    function renderTable(direction, tbodyId) {
      const tbody = $(tbodyId);
      tbody.innerHTML = "";
      const list = padRows(rows[direction], direction);
      const canRemoveAny = list.length > MIN_ROWS;

      list.forEach((row, index) => {
        const tr = createRowElement(
          direction,
          {
            amount: row.amount,
            description: row.description || "",
            id: row.id,
          },
          index,
          canRemoveAny
        );
        tbody.appendChild(tr);
      });

      bindCellEvents(tbody);
    }

    function bindRemoveButtonsOnce() {
      if (bindRemoveButtonsOnce.done) return;
      bindRemoveButtonsOnce.done = true;

      ["outgoingBody", "incomingBody"].forEach((id) => {
        $(id).addEventListener("click", (e) => {
          const btn = e.target.closest(".btn-remove-row");
          if (!btn || btn.disabled) return;
          const tr = btn.closest("tr");
          const index = [...$(id).querySelectorAll("tr")].indexOf(tr);
          if (index >= 0) removeRowAtIndex(index);
        });
      });
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/"/g, "&quot;");
    }

    function bindCellEvents(tbody) {
      tbody.querySelectorAll(".cell-input").forEach((input) => {
        input.addEventListener("focus", () => {
          if (input.dataset.field === "amount" && input.value) {
            const n = parseAmount(input.value);
            input.value = n ? n.toFixed(2) : "";
          }
        });

        input.addEventListener("blur", () => {
          if (input.dataset.field === "amount") {
            const n = parseAmount(input.value);
            input.value = n ? "£ " + n.toFixed(2) : "";
          }
          queueSaveFromDom();
        });

        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            input.blur();
          }
        });
      });
    }

    function assignIdsToDom(direction, savedRows) {
      const tbody = direction === "incoming" ? $("incomingBody") : $("outgoingBody");
      let idx = 0;
      tbody.querySelectorAll("tr").forEach((tr) => {
        const amount = parseAmount(tr.querySelector('[data-field="amount"]').value);
        const description = (tr.querySelector('[data-field="description"]').value || "").trim();
        if (!amount && !description && !tr.dataset.id) return;
        const saved = savedRows[idx++];
        if (saved?.id) tr.dataset.id = saved.id;
      });
    }

    function readDomRows(direction) {
      const tbody = direction === "incoming" ? $("incomingBody") : $("outgoingBody");
      const result = [];
      tbody.querySelectorAll("tr").forEach((tr, index) => {
        const amount = parseAmount(tr.querySelector('[data-field="amount"]').value);
        const description = (tr.querySelector('[data-field="description"]').value || "").trim();
        const id = tr.dataset.id || null;
        if (!amount && !description && !id) return;
        result.push({ id, direction, amount, description, sort_order: index });
      });
      return result;
    }

    function updateTotal() {
      const incoming = readDomRows("incoming");
      const outgoing = readDomRows("outgoing");
      const total = incoming.reduce((s, r) => s + r.amount, 0) - outgoing.reduce((s, r) => s + r.amount, 0);
      const el = $("totalValue");
      el.textContent = formatMoney(total);
      el.classList.remove("negative", "positive");
      if (total < 0) el.classList.add("negative");
      else if (total > 0) el.classList.add("positive");
      return total;
    }

    function readAllDisplayRows(direction) {
      const tbody = direction === "incoming" ? $("incomingBody") : $("outgoingBody");
      return [...tbody.querySelectorAll("tr")].map((tr) => ({
        amount: parseAmount(tr.querySelector('[data-field="amount"]').value),
        description: (tr.querySelector('[data-field="description"]').value || "").trim(),
      }));
    }

    function formatExcelAmount(n) {
      if (!n) return "";
      return n;
    }

    function buildExportWorkbook() {
      const outRows = readAllDisplayRows("outgoing");
      const inRows = readAllDisplayRows("incoming");
      const rowCount = Math.max(outRows.length, inRows.length, MIN_ROWS);
      const total = updateTotal();

      const aoa = [
        ["Outgoing", "", "", "Incoming", ""],
        ["Amount £", "Description", "", "Amount £", "Description"],
      ];

      for (let i = 0; i < rowCount; i++) {
        const o = outRows[i] || { amount: 0, description: "" };
        const n = inRows[i] || { amount: 0, description: "" };
        aoa.push([
          formatExcelAmount(o.amount),
          o.description,
          "",
          formatExcelAmount(n.amount),
          n.description,
        ]);
      }

      aoa.push([]);
      aoa.push(["", "", "", "Total:", total]);

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws["!merges"] = [
        { s: { r: 0, c: 0 }, e: { r: 0, c: 1 } },
        { s: { r: 0, c: 3 }, e: { r: 0, c: 4 } },
      ];
      ws["!cols"] = [{ wch: 14 }, { wch: 30 }, { wch: 3 }, { wch: 14 }, { wch: 30 }];

      for (let i = 2; i < 2 + rowCount; i++) {
        [0, 3].forEach((col) => {
          const val = aoa[i][col];
          if (val === "" || val == null) return;
          const addr = XLSX.utils.encode_cell({ r: i, c: col });
          if (ws[addr]) {
            ws[addr].t = "n";
            ws[addr].z = '"£"#,##0.00';
          }
        });
      }

      const totalAddr = XLSX.utils.encode_cell({ r: aoa.length - 1, c: 4 });
      if (ws[totalAddr]) {
        ws[totalAddr].t = "n";
        ws[totalAddr].z = '"£"#,##0.00';
      }

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Fund Sheet");

      const date = new Date().toISOString().slice(0, 10);
      const filename = `poppin-fund-sheet-${date}.xlsx`;

      return { wb, aoa, total, filename, rowCount };
    }

    function renderExportPreviewHtml({ total, rowCount }) {
      const outRows = readAllDisplayRows("outgoing");
      const inRows = readAllDisplayRows("incoming");
      const count = Math.max(rowCount, outRows.length, inRows.length);

      let bodyRows = "";
      for (let i = 0; i < count; i++) {
        const o = outRows[i] || { amount: 0, description: "" };
        const n = inRows[i] || { amount: 0, description: "" };
        const oAmt = o.amount ? formatMoney(o.amount) : "";
        const nAmt = n.amount ? formatMoney(n.amount) : "";
        bodyRows += `
          <tr>
            <td class="amount-cell">${escapeHtml(oAmt)}</td>
            <td>${escapeHtml(o.description)}</td>
            <td class="gap-col"></td>
            <td class="amount-cell">${escapeHtml(nAmt)}</td>
            <td>${escapeHtml(n.description)}</td>
          </tr>
        `;
      }

      const totalClass =
        total < 0 ? "negative" : total > 0 ? "positive" : "";

      return `
        <table class="preview-excel-table">
          <thead>
            <tr>
              <th class="section-head" colspan="2">Outgoing</th>
              <th class="gap-col"></th>
              <th class="section-head" colspan="2">Incoming</th>
            </tr>
            <tr>
              <th class="col-head">Amount £</th>
              <th class="col-head">Description</th>
              <th class="gap-col"></th>
              <th class="col-head">Amount £</th>
              <th class="col-head">Description</th>
            </tr>
          </thead>
          <tbody>${bodyRows}</tbody>
          <tfoot>
            <tr class="total-row">
              <td colspan="3"></td>
              <td><strong>Total:</strong></td>
              <td class="amount-cell ${totalClass}"><strong>${formatMoney(total)}</strong></td>
            </tr>
          </tfoot>
        </table>
      `;
    }

    function openExportModal() {
      if (typeof XLSX === "undefined") {
        showToast({ message: "Excel library failed to load", type: "error" });
        return;
      }

      const data = buildExportWorkbook();
      pendingExport = data;
      $("exportFilename").textContent = data.filename;
      $("exportPreview").innerHTML = renderExportPreviewHtml(data);
      show($("exportModal"));
      document.body.style.overflow = "hidden";
    }

    function closeExportModal() {
      hide($("exportModal"));
      document.body.style.overflow = "";
      pendingExport = null;
    }

    function downloadExportFile() {
      if (!pendingExport?.wb) return;
      XLSX.writeFile(pendingExport.wb, pendingExport.filename);
      showToast({ message: "Excel file downloaded" });
      closeExportModal();
    }

    function queueSaveFromDom() {
      updateTotal();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveAll, 600);
    }

    async function refreshAuditFromDb() {
      const { data, error } = await sb
        .from(TABLE)
        .select("id, direction, amount, description, created_at, updated_at")
        .order("updated_at", { ascending: false });

      if (error) return;
      sheetRecords = data || [];
      renderAuditLog();
    }

    async function saveAll() {
      if (isSaving) return;
      const incoming = readDomRows("incoming");
      const outgoing = readDomRows("outgoing");
      const toSave = [...incoming, ...outgoing];

      isSaving = true;
      setStatus("Saving…", "saving");

      try {
        const { data: existing, error: fetchErr } = await sb
          .from(TABLE)
          .select("id, direction, amount, description, created_at, updated_at");
        if (fetchErr) throw fetchErr;

        const keepIds = new Set(toSave.filter((r) => r.id).map((r) => r.id));
        const toDeleteIds = (existing || [])
          .map((r) => r.id)
          .filter((id) => !keepIds.has(id));

        let deletedSnapshot = null;

        if (toDeleteIds.length) {
          const deletedRows = (existing || []).filter((r) => toDeleteIds.includes(r.id));
          deletedSnapshot = deletedRows.map((r) => ({
            direction: r.direction,
            amount: Number(r.amount) || 0,
            description: r.description || "",
            sort_order: r.sort_order ?? 0,
          }));

          for (const row of deletedRows) {
            auditExtras.push({
              type: "deleted",
              at: new Date(),
              direction: row.direction === "incoming" ? "incoming" : "outgoing",
              amount: formatMoney(Number(row.amount) || 0),
              description: (row.description || "").trim() || "(no description)",
              id: row.id,
            });
          }
          auditExtras = auditExtras.slice(-50);

          const { error: delErr } = await sb.from(TABLE).delete().in("id", toDeleteIds);
          if (delErr) throw delErr;
        }

        for (const row of toSave) {
          const payload = {
            direction: row.direction,
            amount: row.amount,
            description: row.description,
            sort_order: row.sort_order,
          };

          if (row.id) {
            const { error } = await sb.from(TABLE).update(payload).eq("id", row.id);
            if (error) throw error;
          } else {
            const { data: inserted, error } = await sb
              .from(TABLE)
              .insert(payload)
              .select("id")
              .single();
            if (error) throw error;
            row.id = inserted.id;
          }
        }

        assignIdsToDom("incoming", incoming);
        assignIdsToDom("outgoing", outgoing);
        rows.incoming = incoming;
        rows.outgoing = outgoing;

        await refreshAuditFromDb();
        setStatus("Ready", "");

        if (deletedSnapshot?.length) {
          const n = deletedSnapshot.length;
          showToast({
            message: n === 1 ? "1 entry deleted from records" : `${n} entries deleted from records`,
            type: "destructive",
            undo: async () => {
              try {
                const { error } = await sb.from(TABLE).insert(deletedSnapshot);
                if (error) throw error;
                auditExtras = auditExtras.filter((e) => e.type !== "deleted");
                await loadSheet();
                showToast({
                  message: n === 1 ? "Entry restored" : `${n} entries restored`,
                });
              } catch (undoErr) {
                showToast({ message: "Undo failed: " + undoErr.message, type: "error" });
              }
            },
          });
        } else {
          showToast({ message: "Changes saved" });
        }
      } catch (err) {
        setStatus("Save failed", "error");
        showToast({ message: "Save failed: " + err.message, type: "error" });
      } finally {
        isSaving = false;
      }
    }

    async function loadSheet() {
      const showOverlay = !hasLoadedOnce;
      if (showOverlay) show($("loadingOverlay"));
      try {
        const { data, error } = await sb
          .from(TABLE)
          .select("id, direction, amount, description, sort_order, created_at, updated_at")
          .order("sort_order", { ascending: true });

        if (error) throw error;

        sheetRecords = (data || []).map((r) => ({
          id: r.id,
          direction: r.direction,
          amount: r.amount,
          description: r.description,
          created_at: r.created_at,
          updated_at: r.updated_at,
        }));

        rows = { incoming: [], outgoing: [] };
        extraBlankRows = 0;

        (data || []).forEach((r) => {
          const dir = r.direction === "incoming" ? "incoming" : "outgoing";
          rows[dir].push({
            id: r.id,
            direction: dir,
            amount: Number(r.amount) || 0,
            description: r.description || "",
            sort_order: r.sort_order ?? 0,
          });
        });

        const maxLen = Math.max(rows.incoming.length, rows.outgoing.length);
        if (maxLen >= MIN_ROWS) extraBlankRows = maxLen - MIN_ROWS + 1;

        renderBothTables();
        updateTotal();
        renderAuditLog();
        hasLoadedOnce = true;
      } finally {
        if (showOverlay) hide($("loadingOverlay"));
      }
    }

    function showApp() {
      hide($("loginView"));
      show($("appView"));
    }

    function showLogin() {
      show($("loginView"));
      hide($("appView"));
    }

    async function initSession() {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        $("statusUser").textContent = session.user.email || "";
        showApp();
        await loadSheet();
      } else {
        showLogin();
      }
    }

    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = $("loginBtn");
      const errEl = $("loginError");
      errEl.textContent = "";
      btn.disabled = true;

      const { data, error } = await sb.auth.signInWithPassword({
        email: LOGIN_EMAIL,
        password: $("password").value,
      });

      btn.disabled = false;

      if (error) {
        errEl.textContent = error.message;
        return;
      }

      $("statusUser").textContent = data.user?.email || LOGIN_EMAIL;
      $("password").value = "";
      auditExtras = [];
      showApp();
      await loadSheet();
    });

    $("signOutBtn").addEventListener("click", async () => {
      await sb.auth.signOut();
      window.location.href = "/actions/internal/logout.html";
    });

    document.querySelectorAll(".btn-add").forEach((btn) => {
      btn.addEventListener("click", addRowPair);
    });

    $("exportExcelBtn").addEventListener("click", openExportModal);
    $("exportCloseBtn").addEventListener("click", closeExportModal);
    $("exportCancelBtn").addEventListener("click", closeExportModal);
    $("exportDownloadBtn").addEventListener("click", downloadExportFile);

    $("exportModal").addEventListener("click", (e) => {
      if (e.target === $("exportModal")) closeExportModal();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !$("exportModal").classList.contains("hidden")) {
        closeExportModal();
      }
    });

    sb.auth.onAuthStateChange((_event, session) => {
      if (!session && !$("appView").classList.contains("hidden")) {
        showLogin();
      }
    });

    bindRemoveButtonsOnce();
    initSession();
  </script>
</body>
</html>
