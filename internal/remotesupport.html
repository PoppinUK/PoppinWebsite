<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poppin - Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-brand { font-family: 'Bungee', cursive; }
        .text-pop-red { color: #FF2E63; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeInUp 0.4s ease-out forwards; }
        .hidden-view { display: none !important; }
        .glass-panel { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(0,0,0,0.05); }
        video { width: 100%; height: 100%; object-fit: contain; background: #0f172a; }
        .chat-bubble-admin { background: #0f172a; color: white; border-radius: 1rem 1rem 0 1rem; }
        .chat-bubble-staff { background: #f3f4f6; color: #1f2937; border-radius: 1rem 1rem 1rem 0; }
    </style>
</head>
<body class="bg-stone-50 text-slate-900 min-h-screen flex flex-col overflow-hidden">
    <nav class="p-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <img src="https://poppin.pages.dev/text.png" alt="Poppin" class="h-6 w-auto">
            <div id="navStatus" class="hidden flex items-center gap-4">
                <div id="roleIndicator" class="px-3 py-1 bg-white border border-stone-100 rounded-full text-[10px] font-bold uppercase tracking-wider text-slate-400">
                    Session Active
                </div>
                <button onclick="location.reload()" class="text-slate-400 hover:text-pop-red transition-colors">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center px-6 pb-6 overflow-hidden">
        <div id="authContainer" class="w-full max-w-sm animate-fade-up">
            <div id="supportView">
                <div class="text-center mb-10">
                    <h1 class="font-brand text-2xl uppercase tracking-tight mb-2">Support <span class="text-pop-red">Code</span></h1>
                    <p class="text-slate-400 text-sm">Enter the code provided by your admin</p>
                </div>
                <form id="supportForm" class="space-y-6">
                    <div>
                        <input type="text" id="supportCode" placeholder="000-000" maxlength="7" class="w-full bg-white border border-stone-100 rounded-2xl px-4 py-5 text-center text-3xl font-brand tracking-widest focus:ring-2 focus:ring-pop-red/10 focus:border-pop-red outline-none transition-all placeholder:text-stone-100" required>
                    </div>
                    <button type="submit" id="staffJoinBtn" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-black transition-all flex items-center justify-center gap-2 group">
                        Start Sharing Screen
                    </button>
                </form>
                <div id="statusMessage" class="mt-6 text-center text-sm font-semibold hidden"></div>
                <div class="mt-12 space-y-4 text-center">
                    <button onclick="showAdminLogin()" class="w-full py-4 rounded-2xl border-2 border-stone-100 text-slate-400 font-bold text-sm hover:border-slate-200 hover:text-slate-600 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-user-shield"></i>
                        Login as Admin
                    </button>
                </div>
            </div>

            <div id="adminView" class="hidden-view">
                <div class="text-center mb-10">
                    <h1 class="font-brand text-2xl uppercase tracking-tight mb-2">Admin <span class="text-pop-red">Login</span></h1>
                </div>
                <form id="adminForm" class="space-y-4">
                    <input type="text" id="adminUsername" value="admin" class="w-full bg-white border border-stone-100 rounded-2xl px-4 py-4 focus:ring-2 focus:ring-pop-red/10 focus:border-pop-red outline-none" required>
                    <input type="password" id="adminPassword" placeholder="Password" class="w-full bg-white border border-stone-100 rounded-2xl px-4 py-4 focus:ring-2 focus:ring-pop-red/10 focus:border-pop-red outline-none" required>
                    <button type="submit" id="adminSubmitBtn" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-black transition-all">
                        Sign In
                    </button>
                </form>
                <div id="adminStatus" class="mt-6 text-center text-sm font-semibold"></div>
                <div class="mt-8 text-center">
                    <button onclick="showSupportCode()" class="text-xs font-bold text-stone-300 hover:text-slate-500 uppercase tracking-widest">
                        Back
                    </button>
                </div>
            </div>
        </div>

        <div id="dashboardView" class="hidden-view w-full max-w-7xl h-full flex gap-6 animate-fade-up overflow-hidden">
            <div class="w-80 flex flex-col gap-4 h-full">
                <div class="glass-panel rounded-3xl p-6 text-center">
                    <h3 class="font-brand text-sm uppercase tracking-tight mb-4">Support <span class="text-pop-red">Tools</span></h3>
                    <div class="p-4 bg-stone-50 border border-stone-100 rounded-2xl mb-4 relative group">
                        <p class="text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-2">Session Code</p>
                        <div id="generatedCode" class="text-2xl font-brand text-slate-800 tracking-widest cursor-pointer" onclick="copyCode()">--- ---</div>
                        <div id="copyToast" class="absolute -top-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-[10px] px-2 py-1 rounded opacity-0 transition-opacity">Copied!</div>
                    </div>
                    <p class="text-[11px] text-slate-400 leading-relaxed">
                        Share this code with the person you wish to give support to.
                    </p>
                </div>
                <div class="flex-grow glass-panel rounded-3xl flex flex-col overflow-hidden">
                    <div class="p-4 border-b border-stone-50 flex items-center justify-between bg-white/50">
                        <span class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Live Chat</span>
                    </div>
                    <div id="chatBox" class="flex-grow p-4 space-y-4 overflow-y-auto">
                        <div class="bg-stone-50 p-3 rounded-2xl text-xs text-slate-500 italic text-center">Waiting for connection...</div>
                    </div>
                    <form id="chatForm" class="p-4 bg-white border-t border-stone-50">
                        <div class="relative">
                            <input type="text" id="chatInput" placeholder="Type a message..." class="w-full bg-stone-50 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-pop-red/10 border border-transparent focus:border-pop-red/20 transition-all">
                            <button type="submit" class="absolute right-3 top-2.5 text-slate-300 hover:text-pop-red">
                                <i class="fa-solid fa-paper-plane"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="videoContainer" class="flex-grow glass-panel rounded-[2rem] overflow-hidden relative bg-slate-900 group">
                <div id="videoPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center text-center p-12 z-10">
                    <div class="w-16 h-16 border-4 border-slate-800 border-t-pop-red rounded-full animate-spin mb-6"></div>
                    <h2 class="text-white font-brand text-lg uppercase mb-2">Waiting for stream</h2>
                </div>
                <video id="remoteVideo" autoplay playsinline class="hidden w-full h-full"></video>
                
                <div class="absolute bottom-6 right-6 flex gap-3 opacity-0 group-hover:opacity-100 transition-opacity z-20">
                    <button onclick="takeSnapshot()" title="Capture Screenshot" class="w-12 h-12 bg-white/10 hover:bg-white/20 backdrop-blur-xl text-white rounded-2xl transition-all border border-white/10">
                        <i class="fa-solid fa-camera"></i>
                    </button>
                    <button onclick="toggleFullscreen()" title="Fullscreen" class="w-12 h-12 bg-white/10 hover:bg-white/20 backdrop-blur-xl text-white rounded-2xl transition-all border border-white/10">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                </div>

                <div class="absolute top-6 left-6 z-20">
                    <div id="liveBadge" class="hidden px-3 py-1.5 bg-pop-red rounded-full text-[10px] font-bold text-white uppercase tracking-widest shadow-lg shadow-pop-red/20 animate-pulse">
                        <i class="fa-solid fa-circle mr-1.5 text-[6px] align-middle"></i> Live Feed
                    </div>
                </div>
            </div>
        </div>
    </main>

    <canvas id="snapshotCanvas" class="hidden"></canvas>

    <script>
        const SUPABASE_URL = 'https://smdcuevcrnhjrzjdffoi.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_M-7STvwzq8fls2pULfYVoA_GYhHe6QP';
        const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let pc; 
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        let currentSessionCode = null;
        let activeChannel = null;
        let userRole = 'staff'; 

        function showAdminLogin() {
            document.getElementById('supportView').classList.add('hidden-view');
            document.getElementById('adminView').classList.remove('hidden-view');
        }

        function showSupportCode() {
            document.getElementById('adminView').classList.add('hidden-view');
            document.getElementById('supportView').classList.remove('hidden-view');
        }

        function copyCode() {
            const code = document.getElementById('generatedCode').innerText;
            const tempInput = document.createElement('input');
            tempInput.value = code;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            const toast = document.getElementById('copyToast');
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2000);
        }

        function appendMessage(text, role) {
            const chatBox = document.getElementById('chatBox');
            if (chatBox.querySelector('div.italic')) chatBox.innerHTML = '';
            
            const div = document.createElement('div');
            div.className = `flex ${role === 'admin' ? 'justify-end' : 'justify-start'}`;
            
            const inner = document.createElement('div');
            inner.className = `max-w-[80%] p-3 text-sm shadow-sm ${role === 'admin' ? 'chat-bubble-admin' : 'chat-bubble-staff'}`;
            inner.innerText = text;
            
            div.appendChild(inner);
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function toggleFullscreen() {
            const container = document.getElementById('videoContainer');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => console.error(err));
            } else {
                document.exitFullscreen();
            }
        }

        function takeSnapshot() {
            const video = document.getElementById('remoteVideo');
            if (video.paused || video.ended) return;
            
            const canvas = document.getElementById('snapshotCanvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const link = document.createElement('a');
            link.download = `poppin-capture-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }

        async function launchDashboard(role) {
            userRole = role;
            document.getElementById('authContainer').classList.add('hidden-view');
            document.getElementById('dashboardView').classList.remove('hidden-view');
            document.getElementById('navStatus').classList.remove('hidden');
            document.getElementById('roleIndicator').innerText = role === 'admin' ? 'Admin Session' : 'Staff Session';
            
            if (role === 'admin') {
                const code = Math.floor(100000 + Math.random() * 900000).toString();
                currentSessionCode = code.slice(0,3) + '-' + code.slice(3,6);
                document.getElementById('generatedCode').innerText = currentSessionCode;
                setupWebRTCAdmin(currentSessionCode);
            }
        }

        async function setupWebRTCAdmin(code) {
            pc = new RTCPeerConnection(config);
            pc.ontrack = (event) => {
                const video = document.getElementById('remoteVideo');
                const placeholder = document.getElementById('videoPlaceholder');
                const badge = document.getElementById('liveBadge');
                video.srcObject = event.streams[0];
                video.classList.remove('hidden');
                placeholder.classList.add('hidden');
                badge.classList.remove('hidden');
            };

            pc.onicecandidate = (event) => {
                if (event.candidate && activeChannel) {
                    activeChannel.send({ 
                        type: 'broadcast', 
                        event: 'signal', 
                        payload: { type: 'ice-candidate', candidate: event.candidate, from: 'admin' }
                    });
                }
            };

            activeChannel = sbClient.channel(`session-${code}`)
                .on('broadcast', { event: 'signal' }, async ({ payload }) => {
                    if (payload.from === 'admin') return; 
                    if (payload.type === 'offer') {
                        await pc.setRemoteDescription(new RTCSessionDescription(payload.offer));
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        activeChannel.send({ type: 'broadcast', event: 'signal', payload: { type: 'answer', answer, from: 'admin' } });
                    } else if (payload.type === 'ice-candidate') {
                        try { await pc.addIceCandidate(new RTCIceCandidate(payload.candidate)); } catch (e) {}
                    }
                })
                .on('broadcast', { event: 'chat' }, ({ payload }) => {
                    appendMessage(payload.text, payload.role);
                })
                .subscribe();
        }

        document.getElementById('chatForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !activeChannel) return;

            activeChannel.send({
                type: 'broadcast',
                event: 'chat',
                payload: { text, role: userRole }
            });

            appendMessage(text, userRole);
            input.value = '';
        });

        document.getElementById('supportForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('supportCode').value;
            const btn = document.getElementById('staffJoinBtn');
            btn.disabled = true;
            btn.innerText = "Requesting Screen...";

            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                await launchDashboard('staff');
                document.getElementById('generatedCode').innerText = code;
                
                pc = new RTCPeerConnection(config);
                stream.getTracks().forEach(track => pc.addTrack(track, stream));

                activeChannel = sbClient.channel(`session-${code}`)
                    .on('broadcast', { event: 'signal' }, async ({ payload }) => {
                        if (payload.from === 'staff') return; 
                        if (payload.type === 'answer') {
                            await pc.setRemoteDescription(new RTCSessionDescription(payload.answer));
                        } else if (payload.type === 'ice-candidate') {
                            try { await pc.addIceCandidate(new RTCIceCandidate(payload.candidate)); } catch (e) {}
                        }
                    })
                    .on('broadcast', { event: 'chat' }, ({ payload }) => {
                        appendMessage(payload.text, payload.role);
                    })
                    .subscribe();
                
                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        activeChannel.send({ type: 'broadcast', event: 'signal', payload: { type: 'ice-candidate', candidate: event.candidate, from: 'staff' } });
                    }
                };

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                activeChannel.send({ type: 'broadcast', event: 'signal', payload: { type: 'offer', offer, from: 'staff' } });

                btn.innerText = "Sharing Screen...";
            } catch (err) {
                btn.disabled = false;
                btn.innerText = "Error: Permission Denied";
            }
        });

        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminUsername').value + "@poppin.internal";
            const password = document.getElementById('adminPassword').value;
            const status = document.getElementById('adminStatus');
            
            const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
            if (error) {
                status.innerText = error.message;
                status.className = "mt-6 text-center text-sm font-semibold text-red-500";
            } else {
                launchDashboard('admin');
            }
        });

        document.getElementById('supportCode').addEventListener('input', (e) => {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length > 3) val = val.slice(0, 3) + '-' + val.slice(3, 6);
            e.target.value = val;
        });
    </script>
</body>
</html>
