<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Passkey Auth Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 fade-in">
        <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">Supabase Passkey Auth</h1>
        
        <div id="status-box" class="hidden p-4 rounded-lg mb-6 text-sm font-medium"></div>

        <div id="auth-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Project URL</label>
                <input type="text" id="supabase-url" value="https://jijawenoxizwwnpgnbsw.supabase.co" class="w-full mt-1 p-2 border rounded-md">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Anon Key</label>
                <input type="password" id="supabase-key" value="sb_publishable_qxvoI4ZBtt2qV3qWicrhaw_eZKvLPRR" class="w-full mt-1 p-2 border rounded-md">
            </div>

            <hr class="my-4">

            <button onclick="registerPasskey()" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 transition">
                Register New Passkey
            </button>
            <button onclick="signInPasskey()" class="w-full bg-gray-900 text-white py-2 rounded-lg hover:bg-gray-800 transition">
                Sign In with Passkey
            </button>
        </div>

        <div id="user-info" class="hidden space-y-4">
            <p class="text-green-600 font-semibold">Logged in successfully!</p>
            <button onclick="signOut()" class="w-full text-red-600 underline">Sign Out</button>
        </div>
    </div>

    <script>
        let supabase = null;

        function showMessage(msg, type = 'info') {
            const box = document.getElementById('status-box');
            box.classList.remove('hidden', 'bg-blue-100', 'text-blue-700', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
            box.classList.add(type === 'error' ? 'bg-red-100' : 'bg-green-100', type === 'error' ? 'text-red-700' : 'text-green-700');
            box.textContent = msg;
            box.classList.remove('hidden');
        }

        function initSupabase() {
            const url = document.getElementById('supabase-url').value;
            const key = document.getElementById('supabase-key').value;
            if (!url || !key) return null;
            return supabase = supabase.createClient(url, key);
        }

        async function registerPasskey() {
            if (!initSupabase()) return showMessage("Please enter URL and Key", "error");
            
            try {
                const { data, error } = await supabase.auth.signUpWithPasskey({
                    username: 'user_' + Math.floor(Math.random() * 1000) 
                });
                if (error) throw error;
                showMessage("Passkey registered! You can now sign in.");
            } catch (err) {
                showMessage(err.message, "error");
            }
        }

        async function signInPasskey() {
            if (!initSupabase()) return showMessage("Please enter URL and Key", "error");

            try {
                const { data, error } = await supabase.auth.signInWithPasskey();
                if (error) throw error;
                
                document.getElementById('auth-form').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                showMessage("Sign-in successful!");
            } catch (err) {
                showMessage(err.message, "error");
            }
        }

        async function signOut() {
            await supabase.auth.signOut();
            window.location.reload();
        }
    </script>
</body>
</html>
