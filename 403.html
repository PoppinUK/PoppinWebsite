<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Forbidden</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeInUp 0.6s ease-out forwards; }
    </style>
</head>
<body class="bg-white text-slate-900 min-h-screen flex items-center p-6 md:p-24">

    <main class="max-w-2xl w-full animate-fade-up text-left">
        <h1 class="text-8xl font-black text-slate-900 mb-4 tracking-tighter">403</h1>
        <h2 class="text-4xl font-bold text-slate-800 mb-6">Access Denied</h2>
        
        <p class="text-slate-500 mb-10 text-lg leading-relaxed">
            You don't have the necessary permissions to view this resource. Please contact an administrator if you believe this is an error or try logging in with a different account.
        </p>
        
        <div class="flex flex-col sm:flex-row gap-4">
            <a href="index.html" class="inline-flex items-center justify-center bg-slate-900 text-white px-10 py-4 rounded-lg text-lg font-bold hover:bg-slate-700 transition-all duration-200 group">
                <i class="fa-solid fa-house mr-3"></i> Back to Home
            </a>
        </div>
    </main>

</body>
</html>
